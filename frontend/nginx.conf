server {
    listen 80;
    server_name localhost;

    # Compresión gzip para optimizar ancho de banda y velocidad de carga
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Directorio de los archivos estáticos generados por Vite
    root /usr/share/nginx/html;
    index index.html;

    # Enrutamiento de Single Page Application (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso para la API de FastAPI
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tiempos de espera adecuados para exportación de archivos y reportes
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Soporte para consultar la documentación interactiva Swagger desde el mismo puerto
    location ~ ^/(docs|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Caché agresivo para archivos inmutables compilados
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Manejo de errores de servidor
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
